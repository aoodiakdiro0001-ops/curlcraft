function tokenize(cmd){
cmd=String(cmd||'').replace(/\\\r?\n/g,' ');
const out=[];let cur='',q=null,esc=false;
for(const ch of cmd){
if(esc){cur+=ch;esc=false;continue;}
if(ch==='\\'){esc=true;continue;}
if(q){if(ch===q)q=null;else cur+=ch;}
else if(ch==='"'||ch==="'")q=ch;
else if(/\s/.test(ch)){if(cur){out.push(cur);cur='';}}
else cur+=ch;}
if(cur)out.push(cur);
return out;
}
function parseCurl(cmd){
const tk=tokenize(cmd);
let i=0;if(tk[0]==='curl')i=1;
const o={method:'GET',url:'',headers:[],data:[],auth:null,insecure:false,follow:false,ua:'',proxy:'',timeout:'',compressed:false,cookies:[],get:false};
const next=()=>tk[++i]||'';
for(;i<tk.length;i++){const a=tk[i];
if(a==='-X'||a==='--request')o.method=next().toUpperCase();
else if(a==='-H'||a==='--header'){const h=next(),j=h.indexOf(':');if(j>0)o.headers.push([h.slice(0,j).trim(),h.slice(j+1).trim()]);}
else if(['-d','--data','--data-raw','--data-binary','--data-ascii','--data-urlencode'].includes(a))o.data.push(next());
else if(a==='--json'){const d=next();o.data.push(d);if(!o.headers.some(h=>h[0].toLowerCase()==='content-type'))o.headers.push(['Content-Type','application/json']);}
else if(a==='-G'||a==='--get')o.get=true;
else if(a==='-u'||a==='--user')o.auth=next();
else if(a==='-A'||a==='--user-agent')o.ua=next();
else if(a==='-x'||a==='--proxy')o.proxy=next();
else if(a==='-m'||a==='--max-time')o.timeout=next();
else if(a==='-k'||a==='--insecure')o.insecure=true;
else if(a==='-L'||a==='--location')o.follow=true;
else if(a==='--compressed')o.compressed=true;
else if(a==='-b'||a==='--cookie')o.cookies.push(next());
else if(a==='--url')o.url=next();
else if(a==='-o'||a==='-O'||a==='-c'||a==='-s'||a==='-S'||a==='-v'||a==='-i'||a==='-sS') {if(['-o','-c'].includes(a))i++;}
else if(!a.startsWith('-')&&!o.url)o.url=a;
}
if(o.data.length&&o.method==='GET'&&!o.get)o.method='POST';
if(o.get&&o.data.length){const q=o.data.join('&');o.url+=(o.url.includes('?')?'&':'?')+q;o.data=[];}
return o;
}

s+=`req = Net::HTTP::${cap(o.method.toLowerCase())}.new(uri)\n`;
o.headers.forEach(h=>{s+=`req['${h[0].replace(/'/g,"\\'")}'] = ${js(h[1])}\n`;});
if(b)s+=`req.body = ${js(b)}\n`;
if(o.auth){const u=o.auth.split(':');s+=`req.basic_auth ${js(u[0])}, ${js(u.slice(1).join(':')||'')}\n`;}
s+=`\nres = Net::HTTP.start(uri.hostname, uri.port, use_ssl: uri.scheme == 'https') { |http| http.request(req) }\nputs res.code\nputs res.body\n`;
return s;
}
function genJava(o){
const b=bodyOf(o);
let s=`import java.net.URI;\nimport java.net.http.*;\n\npublic class Req {\n  public static void main(String[] a) throws Exception {\n    HttpClient c = HttpClient.newBuilder()${o.follow?'.followRedirects(HttpClient.Redirect.ALWAYS)':''}.build();\n`;
s+=`    HttpRequest.Builder b = HttpRequest.newBuilder().uri(URI.create(${js(o.url)}));\n`;
o.headers.forEach(h=>{s+=`    b.header(${js(h[0])}, ${js(h[1])});\n`;});
if(o.auth){const u=o.auth.split(':');const cred=btoa2(u[0]+':'+u.slice(1).join(':'));s+=`    b.header("Authorization", "Basic ${cred}");\n`;}
s+=b?`    b.method("${o.method}", HttpRequest.BodyPublishers.ofString(${js(b)}));\n`:`    b.method("${o.method}", HttpRequest.BodyPublishers.noBody());\n`;
s+=`    var r = c.send(b.build(), HttpResponse.BodyHandlers.ofString());\n    System.out.println(r.statusCode() + " " + r.body());\n  }\n}\n`;
return s;
}
function btoa2(s){try{return btoa(unescape(encodeURIComponent(s)));}catch(e){return '';}}
function genCS(o){
const b=bodyOf(o);
let s=`using System.Net.Http;\nusing System.Net.Http.Headers;\n\nvar client = new HttpClient();\n`;
s+=`var req = new HttpRequestMessage(HttpMethod.${cap(o.method.toLowerCase())}, ${js(o.url)});\n`;
o.headers.forEach(h=>{const k=h[0].toLowerCase();if(['content-type','content-length','user-agent','authorization','accept'].includes(k))return;s+=`req.Headers.TryAddWithoutValidation(${js(h[0])}, ${js(h[1])});\n`;});
const ct=(o.headers.find(h=>h[0].toLowerCase()==='content-type')||[])[1]||'application/x-www-form-urlencoded';
if(b)s+=`req.Content = new StringContent(${js(b)}, System.Text.Encoding.UTF8, ${js(ct)});\n`;
if(o.auth){const u=o.auth.split(':');s+=`req.Headers.Authorization = new AuthenticationHeaderValue("Basic", "${btoa2(u[0]+':'+u.slice(1).join(':'))}");\n`;}
s+=`var res = await client.SendAsync(req);\nConsole.WriteLine((int)res.StatusCode + " " + await res.Content.ReadAsStringAsync());\n`;
return s;
}
function cap(s){return s?s[0].toUpperCase()+s.slice(1):s;}
const GEN={python:genPython,js:genJS,go:genGo,rust:genRust,php:genPHP,bash:genBash,ps:genPS,ruby:genRuby,java:genJava,cs:genCS};
const EXT={python:'py',js:'js',go:'go',rust:'rs',php:'php',bash:'sh',ps:'ps1',ruby:'rb',java:'java',cs:'cs'};
let curLang='python',curReq=null;
function buildLangs(){document.getElementById('langBar').innerHTML=LANGS.map(x=>`<button id="lb-${x[0]}" onclick="setCodeLang('${x[0]}')">${x[1]}</button>`).join('');setCodeLang('python');}
function setCodeLang(k){curLang=k;LANGS.forEach(x=>{const b=document.getElementById('lb-'+x[0]);if(b)b.classList.toggle('on',x[0]===k);});paintCode();}
function paintCode(){if(!curReq){document.getElementById('codeOut').textContent='';return;}
document.getElementById('codeOut').textContent=GEN[curLang](curReq);}
function convert(){
const raw=document.getElementById('curlIn').value;
if(!raw.trim()){toast(t('needCurl'));return;}
curReq=parseCurl(raw);paintCode();
}
function loadSample(){document.getElementById('curlIn').value=`curl -X POST https://api.example.com/v1/items -H 'Content-Type: application/json' -H 'Authorization: Bearer abc123' -d '{"name":"x","tags":["a","b"]}' -u 'user:p@ss' --compressed -m 20`;convert();}
function dlCode(){const c=document.getElementById('codeOut').textContent;if(!c.trim())return;const b=new Blob([c],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='request.'+(EXT[curLang]||'txt');a.click();toast(t('dlDone'));}
function showHeaders(){
const raw=document.getElementById('curlIn').value;
if(!raw.trim()){toast(t('needCurl'));return;}
const o=parseCurl(raw);curReq=o;paintCode();
document.getElementById('hdrOut').innerHTML=o.headers.length?`<table class="pt">${o.headers.map(h=>`<tr><td>${h[0]}</td><td class="mono">${h[1]}</td></tr>`).join('')}</table>`:'—';
}
function headersJSON(){if(!curReq)return '{}';const o={};curReq.headers.forEach(h=>{o[h[0]]=h[1];});return JSON.stringify(o,null,2);}
function renderSpons(){
const S=CONFIG.sponsors||[];
document.getElementById('sponsGrid').innerHTML=S.length?S.map(s=>`<div class="spon">${s.img?`<img src="${s.img}" alt="">`:''}<br><a target="_blank" rel="noopener" href="${s.url}">${s.name}</a><br><small>${s.desc||''}</small></div>`).join(''):`<div class="spon">🏢 <b>Hosting</b><br>Your logo here</div><div class="spon">🌐 <b>API Gateway</b><br>Your logo here</div><div class="spon">☁️ <b>Cloud</b><br>Your logo here</div>`;
}
function renderDonate(){
document.getElementById('btcA').textContent=CONFIG.pay.btc;
document.getElementById('usdtA').textContent=CONFIG.pay.usdt;
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
setLang('en');loadAds();renderDonate();
</script>
